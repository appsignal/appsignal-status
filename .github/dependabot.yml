version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      include: ["*"]
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Keep Next.js updates separate because minor releases can be breaking.
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
    # Keep major updates separate for review
    ignore:
      # Ignore updates for packages that are frequently updated
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      include: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      dependencies:
        patterns:
          - "*"
